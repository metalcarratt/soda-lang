<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Capture the full original path + query + hash
      const fullPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      // Redirect to index.html with ?redirect=<original>
      window.location.replace(
        '/soda-lang/?redirect=' + encodeURIComponent(fullPath)
      );
    </script>
  </head>
  <body></body>
</html>
