<!DOCTYPE html>
<html>
  <head>
    <script>
      // Redirect to index.html while preserving the path
      const redirect = '/' + window.location.pathname.replace(/^\//, '');
      window.location.replace(
        '/?' + redirect + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body></body>
</html>
