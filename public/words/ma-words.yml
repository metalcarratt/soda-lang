# pronouns and people
- word: koe
  meaning: you (singular)

- word: au
  meaning: I / me

- word: ngā
  meaning: the (plural)

- word: kaumātua
  meaning: elders

# tense/aspect particles
- word: kei
  meaning: part of present tense/aspect ("is/are at/doing")

- word: te
  meaning: the (singular article), also used with tense particles (kei te, e te etc.)

- word: i
  meaning: past tense marker

- word: ka
  meaning: future/neutral tense marker

# verbs
- word: haere
  meaning: go

- word: hoki
  meaning: return / go back

- word: toro
  meaning: visit

- word: whiti
  meaning: shine / rise (of the sun)

# prepositions and directionals
- word: ki
  meaning: to / towards / at

- word: mai
  meaning: toward speaker

# negation and related particles
- word: kāore
  meaning: not / no

- word: e
  meaning: (negation particle used with kāore + verb)

# nouns and adjectives
- word: pēhea
  meaning: how (state/condition)

- word: kai
  meaning: food / meal

- word: kāinga
  meaning: home

- word: pō
  meaning: night

- word: rā
  meaning: day / sun

- word: pai
  meaning: good

# possessives, conjunctions, misc. particles
- word: tō
  meaning: your (singular, possessive)

- word: āe
  meaning: yes

- word: engari
  meaning: but / however

- word: kia
  meaning: until / so that

- word: anō
  meaning: again / further
